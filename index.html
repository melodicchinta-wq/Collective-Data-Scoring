
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Public Scoreboard (Excel Style) - Archery Pro</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: #f1f5f9; color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; }

    /* NAVBAR PUBLIK */
    .public-navbar { background-color: #ffffff; border-bottom: 1px solid #e2e8f0; padding: 14px 5%; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02); }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.2rem; color: #0f172a; }
    .brand-icon { background-color: #18191c; color: #ffffff; padding: 6px 10px; border-radius: 12px; font-size: 1rem; }
    
    .btn-login-redirect { background: #4f46e5; color: white; padding: 8px 16px; border-radius: 10px; font-weight: 700; font-size: 0.85rem; text-decoration: none; display: flex; align-items: center; gap: 6px; }
    .btn-login-redirect:hover { background: #4338ca; }

    main { max-width: 1200px; width: 100%; margin: 0 auto; padding: 24px 16px; flex: 1; }

    /* CONTAINER PER SESI / PERMAINAN */
    .event-section-wrapper { background: #ffffff; border: 1px solid #cbd5e1; border-radius: 16px; padding: 20px; margin-bottom: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }

    /* HEADER INFO EVENT */
    .event-info-card { background: #18191c; color: #ffffff; border-radius: 12px; padding: 16px 20px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .live-dot { width: 10px; height: 10px; background-color: #22c55e; border-radius: 50%; display: inline-block; margin-right: 6px; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

    /* TABEL GAYA EXCEL (SPREADSHEET STYLE) */
    .excel-container { overflow-x: auto; }
    .excel-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; text-align: left; white-space: nowrap; }
    .excel-table th { background-color: #f8fafc; color: #475569; padding: 10px 12px; border-bottom: 2px solid #cbd5e1; border-right: 1px solid #e2e8f0; font-weight: 800; text-transform: uppercase; }
    .excel-table td { padding: 10px 12px; border-bottom: 1px solid #e2e8f0; border-right: 1px solid #f1f5f9; color: #334155; }
    .excel-table tr:hover { background-color: #f8fafc; }

    .badge-x { background: #fef3c7; color: #b45309; padding: 2px 6px; border-radius: 4px; font-weight: 800; font-size: 0.75rem; }
    
    @media (max-width: 768px) {
      .public-navbar { padding: 12px 16px; }
      .brand span { font-size: 1rem; }
    }
  </style>
</head>
<body>

  <!-- NAVBAR PUBLIK -->
  <header class="public-navbar">
    <div class="brand">
      <div class="brand-icon">🎯</div>
      <span>ARCHERY<span style="color:#6366f1;">PRO</span> <span style="font-size:0.75rem; background:#e0e7ff; color:#3730a3; padding:2px 8px; border-radius:6px; margin-left:6px;">PUBLIC VIEW</span></span>
    </div>
    <a href="login.html" class="btn-login-redirect"><i class="fa-solid fa-right-to-bracket"></i> Login Admin / Scorer</a>
  </header>

  <main>
    <div style="margin-bottom: 20px;">
      <h1 style="font-size: 1.4rem; font-weight: 800; color: #0f172a;">Live Rekap Seluruh Sesi Pertandingan</h1>
      <p style="font-size: 0.85rem; color: #64748b;">Daftar papan skor seluruh turnamen atau klub dari semua akun yang aktif saat ini.</p>
    </div>

    <!-- CONTAINER UTAMA TEMPAT SEMUA TABEL EVENT AKAN DIMUAT -->
    <div id="all-events-container">
      <div style="text-align: center; color: #64748b; padding: 40px; background: #ffffff; border-radius: 16px; border: 1px solid #e2e8f0;">
        Memuat seluruh sesi pertandingan...
      </div>
    </div>
  </main>

  <script>
    // Fungsi untuk memindai dan merender SEMUA event/sesi dari seluruh akun sekaligus
    function renderAllPublicExcelTables() {
      const container = document.getElementById('all-events-container');
      let configsToRender = [];

      // Scan seluruh localStorage untuk mencari SEMUA konfigurasi event dari akun manapun
      for (let i = 0; i < localStorage.length; i++) {
        let key = localStorage.key(i);
        
        // Cari key yang mengandung kata 'archeryConfig' (baik utama maupun milik akun klub/client)
        if (key === 'archeryConfig' || key.startsWith('archeryConfig_')) {
          try {
            let cfg = JSON.parse(localStorage.getItem(key));
            if (cfg && (cfg.eventName || (cfg.participants && cfg.participants.length > 0))) {
              configsToRender.push({ key: key, data: cfg });
            }
          } catch(e) {}
        }
      }

      // Jika sama sekali belum ada data pertandingan dari akun manapun
      if (configsToRender.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; color: #64748b; padding: 40px; background: #ffffff; border-radius: 16px; border: 1px solid #e2e8f0;">
            <i class="fa-solid fa-folder-open" style="font-size: 2.5rem; margin-bottom: 10px; color: #cbd5e1;"></i>
            <p style="font-weight: 700;">Belum ada sesi pertandingan aktif yang tersimpan.</p>
            <p style="font-size: 0.8rem; margin-top: 4px;">Silakan buat setup latihan/event terlebih dahulu melalui panel akun masing-masing.</p>
          </div>
        `;
        return;
      }

      let masterHTML = '';

      // Loop untuk merender setiap sesi/permainan dari semua akun
      configsToRender.forEach((item, index) => {
        let config = item.data;
        let eventName = config.eventName || `Turnamen Sesi ${index + 1}`;
        let eventMeta = `${config.busur || 'Standard'} • ${config.jarak || '-'} • ${config.totalEnd || 5} Rambahan (${config.arrowCount || 3} Arrow per End)`;
        let eventLocation = config.location || 'Lapangan Utama';
        let totalEnd = parseInt(config.totalEnd) || 5;

        if (!config.participants || config.participants.length === 0) {
          return; // Lewati jika sesi kosong
        }

        // Buat Header Tabel Excel
        let headHTML = `
          <tr>
            <th style="width: 40px; text-align:center;">No</th>
            <th>Nama Pemanah</th>
            <th>Klub / Instansi</th>
        `;
        for (let i = 1; i <= totalEnd; i++) {
          headHTML += `<th style="text-align:center;">End ${i}</th>`;
        }
        headHTML += `
            <th style="text-align:center; background:#e0e7ff; color:#3730a3;">10/X</th>
            <th style="text-align:center; background:#dcfce7; color:#166534;">Total Skor</th>
          </tr>
        `;

        // Proses & Hitung Skor Peserta
        let list = config.participants.map((p) => {
          let totalScore = 0;
          let totalX = 0;
          let endScoresSummary = [];

          for (let i = 0; i < totalEnd; i++) {
            let endArr = (p.scores && p.scores[i]) ? p.scores[i] : [];
            let endSum = 0;
            let formattedArrows = endArr.map(score => {
              if (score === 'X') { totalScore += 10; totalX += 1; endSum += 10; return 'X'; }
              else if (score === 'M') { endSum += 0; return 'M'; }
              else { let val = parseInt(score) || 0; totalScore += val; endSum += val; return val; }
            });
            endScoresSummary.push({ arr: formattedArrows, sum: endSum });
          }

          return { ...p, totalScore, totalX, endScoresSummary };
        });

        // Urutkan peringkat berdasarkan total skor tertinggi
        list.sort((a, b) => b.totalScore - a.totalScore || b.totalX - a.totalX);

        // Buat Baris Isi Tabel
        let bodyHTML = '';
        list.forEach((p, idx) => {
          bodyHTML += `
            <tr>
              <td style="text-align:center; font-weight:700; background:#f8fafc;">${idx + 1}</td>
              <td><strong style="color:#0f172a;">${p.name}</strong></td>
              <td><span style="color:#64748b;">${p.club}</span></td>
          `;

          p.endScoresSummary.forEach(end => {
            let strArrows = end.arr.length > 0 ? end.arr.join(' | ') : '-';
            bodyHTML += `<td style="text-align:center;">${strArrows} <span style="font-weight:700; color:#4f46e5; margin-left:4px;">(${end.sum})</span></td>`;
          });

          bodyHTML += `
              <td style="text-align:center; font-weight:800;"><span class="badge-x">${p.totalX}X</span></td>
              <td style="text-align:center; font-weight:800; color:#166534; background:#f0fdf4; font-size:0.9rem;">${p.totalScore}</td>
            </tr>
          `;
        });

        masterHTML += `
          <div class="event-section-wrapper">
            <div class="event-info-card">
              <div>
                <span style="font-size: 0.7rem; font-weight: 800; color: #22c55e;"><span class="live-dot"></span> LIVE REKAP</span>
                <h2 style="font-size: 1.1rem; font-weight: 800; margin-top: 2px;">${eventName}</h2>
                <p style="font-size: 0.75rem; color: #94a3b8; margin-top: 2px;">${eventMeta}</p>
              </div>
              <div style="text-align: right;">
                <span style="font-size: 0.65rem; color: #94a3b8; text-transform: uppercase;">Lokasi</span>
                <div style="font-weight: 700; font-size: 0.8rem;">${eventLocation}</div>
              </div>
            </div>

            <div class="excel-container">
              <table class="excel-table">
                <thead>${headHTML}</thead>
                <tbody>${bodyHTML}</tbody>
              </table>
            </div>
          </div>
        `;
      });

      container.innerHTML = masterHTML;
    }

    // Jalankan saat pertama kali dibuka & refresh otomatis tiap 2 detik
    document.addEventListener("DOMContentLoaded", function() {
      renderAllPublicExcelTables();
    });

    setInterval(() => {
      renderAllPublicExcelTables();
    }, 2000);
  </script>
</body>
</html>
