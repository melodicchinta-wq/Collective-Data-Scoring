<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SCORINGPTU</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    body { 
      background-color: #f3f5f9; 
      color: #1e293b; 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
      padding: 20px; 
    }

    .main-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1;
    }
    
    .login-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 24px; padding: 32px; width: 100%; max-width: 440px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); }
    .brand { display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 800; font-size: 1.4rem; color: #0f172a; margin-bottom: 20px; }
    .brand-icon { background-color: #18191c; color: #ffffff; padding: 6px 12px; border-radius: 12px; font-size: 1.1rem; }
    
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .form-group label { font-size: 0.8rem; font-weight: 700; color: #64748b; }
    .form-control { background-color: #f8fafc; border: 1px solid #e2e8f0; color: #0f172a; padding: 12px 16px; border-radius: 12px; font-size: 0.9rem; outline: none; font-weight: 600; transition: border 0.2s; }
    .form-control:focus { border-color: #6366f1; background-color: #ffffff; }

    .btn-submit { width: 100%; background-color: #18191c; color: #ffffff; font-weight: 800; font-size: 0.95rem; padding: 14px; border-radius: 12px; border: none; cursor: pointer; box-shadow: 0 4px 12px rgba(24, 25, 28, 0.15); transition: background 0.2s; margin-top: 10px; }
    .btn-submit:hover { background-color: #0f172a; }

    .info-box { background: #e0e7ff; color: #3730a3; padding: 12px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; line-height: 1.4; margin-bottom: 20px; }
  </style>
</head>

<body>
<div class="main-wrapper">
  <div class="login-card">
    <div class="brand">
      <div class="brand-icon">🎯</div>
      <span>SCORING<span style="color:#6366f1;">PTU</span></span>
    </div>

    <div class="info-box">
      <i class="fa-solid fa-circle-info"></i> Masukkan data diri Anda untuk masuk ke aplikasi.
    </div>

    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Nama Lengkap / PIC Event *</label>
        <input type="text" id="login-name" class="form-control" placeholder="Contoh: Aul" required>
      </div>

      <div class="form-group">
        <label>Email Akun Resmi *</label>
        <input type="email" id="login-email" class="form-control" placeholder="Contoh: aul@gmail.com" required>
      </div>

      <div class="form-group">
        <label>Klub / Instansi *</label>
        <input type="text" id="login-club" class="form-control" placeholder="Contoh: Sumedang Club" required>
      </div>

      <button type="submit" class="btn-submit">Masuk ke Aplikasi <i class="fa-solid fa-arrow-right"></i></button>
    </form>
  </div>
</div>

<!-- FOOTER -->
<footer style="background: #222; color: white; text-align: center; padding: 15px; width: 100%; border-radius: 8px; margin-top: 20px;">
  <p style="font-size: 0.85rem;">Copyright &copy; 2026 &bull; Mela Aulia Syarifah</p>
</footer>

<script>
  function handleLogin(e) {
    e.preventDefault();

    const name = document.getElementById('login-name').value.trim();
    const email = document.getElementById('login-email').value.trim().toLowerCase();
    const club = document.getElementById('login-club').value.trim();

    // Simpan data user ke localStorage (tanpa pengecekan apapun)
    const activeUser = { name, email, club, role: 'klien' };
    localStorage.setItem('activeArcheryUser', JSON.stringify(activeUser));

    alert(`✨ Selamat datang, ${name}! Login berhasil.`);
    window.location.href = 'home.html';
  }
</script>
</body>

</html>
