<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Akun to - Archery Pro</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: #f3f5f9; color: #1e293b; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .login-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 24px; width: 100%; max-width: 400px; padding: 32px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.3rem; color: #0f172a; margin-bottom: 24px; justify-content: center; }
    .brand-icon { background-color: #18191c; color: #ffffff; padding: 6px 10px; border-radius: 12px; font-size: 1rem; }
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 0.8rem; font-weight: 700; color: #475569; margin-bottom: 6px; text-transform: uppercase; }
    .form-input { width: 100%; padding: 12px 16px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 0.95rem; outline: none; transition: all 0.2s; background: #f8fafc; }
    .form-input:focus { border-color: #6366f1; background: #ffffff; box-shadow: 0 0 0 3px rgba(99,102,241,0.1); }
    .btn-login { width: 100%; background: #18191c; color: #ffffff; border: none; padding: 14px; border-radius: 12px; font-weight: 800; font-size: 1rem; cursor: pointer; margin-top: 8px; transition: background 0.2s; }
    .btn-login:hover { background: #0f172a; }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="brand">
      <div class="brand-icon">🎯</div>
      <span>ARCHERY<span style="color:#6366f1;">PRO</span></span>
    </div>
    
    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label">Nama Lengkap / Pemanah</label>
        <input type="text" id="loginName" class="form-input" placeholder="Contoh: Ahmad Archer" required>
      </div>
      
      <div class="form-group">
        <label class="form-label">Email Akun (Unik)</label>
        <input type="email" id="loginEmail" class="form-input" placeholder="contoh@email.com" required>
      </div>

      <div class="form-group">
        <label class="form-label">Klub / Kontingen</label>
        <input type="text" id="loginClub" class="form-input" placeholder="Contoh: Sumedang Club" required>
      </div>

      <button type="submit" class="btn-login">Masuk ke Aplikasi <i class="fa-solid fa-arrow-right"></i></button>
    </form>
  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      const name = document.getElementById('loginName').value;
      const email = document.getElementById('loginEmail').value;
      const club = document.getElementById('loginClub').value;

      const userData = { name, email, club };
      // Simpan session user aktif
      localStorage.setItem('activeArcheryUser', JSON.stringify(userData));

      // Redirect ke halaman utama setup
      window.location.href = 'home.html';
    }
  </script>
</body>
</html>
